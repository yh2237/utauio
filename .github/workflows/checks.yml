name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./oto -run '^$' -fuzz FuzzScan -fuzztime 10s
      - run: go test ./textdecode -run '^$' -fuzz FuzzDecode -fuzztime 10s
      - run: go test ./presamp -run '^$' -fuzz FuzzParse -fuzztime 10s
      - run: go test ./prefixmap -run '^$' -fuzz FuzzScan -fuzztime 10s
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: GOOS=js GOARCH=wasm go build ./...
